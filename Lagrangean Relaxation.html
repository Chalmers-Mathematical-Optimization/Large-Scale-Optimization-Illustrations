<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagrangean Relaxation</title>
<!--
  Self-contained illustration of Lagrangean relaxation (no external dependencies).

  Problem shown:   min c^T x   s.t.  A_i^T x <= b_i  (i = 1, 2),   x in X_LP
  Relaxation:      h_LP(u) = min { c^T x + sum_{i in R} u_i (A_i^T x - b_i) :
                                   x in X_LP,  A_k^T x <= b_k  (k not in R) }
  where R is the set of relaxed constraints, chosen with the checkboxes beside the constraint rows
  of the system at the top (checked = relaxed). h_LP(u) <= z_LP.

  The vectors A_i are the constraint normals (pointing out of the feasible side), used exactly
  as written in CONFIG (not rescaled). Appending u_i A_i for i in R to c gives the penalised
  objective c + sum_{i in R} u_i A_i.

  Since  h_LP(u) = c^T x(u) + sum_{i in R} u_i (A_i^T x(u) - b_i),  and (A_i^T x(u) - b_i) / ||A_i|| is
  the signed distance from line i to x(u) (positive when x(u) violates constraint i), each term
      u_i (A_i^T x(u) - b_i) = (u_i ||A_i||) * ((A_i^T x(u) - b_i) / ||A_i||)
  is drawn as a rectangle: one side is as long as the penalty arrow u_i A_i, the other is the
  distance from x(u) to the line (red: x(u) violates the constraint, the term adds; green:
  satisfied, the term subtracts).
  The slider ranges are computed from the geometry so that every extreme point that is optimal
  for some u >= 0 can be reached (with ~15% headroom). Long arrows and boxes simply run off the view.
  The panel below the controls plots h_LP: one line per extreme point (one relaxed constraint),
  or a map over (u_1, u_2) coloured by the optimal extreme point (both relaxed).

  Embed with e.g.  <iframe src="lagrangean-relaxation.html?u1=0.8&u2=0.5" width="760" height="1100"></iframe>
  Optional URL parameters: lp=1 | 2 (which LP, as in the dropdown at the top; default 1), u1, u2 (initial prices; u sets both), relax=12 | 1 | 2 | none
  (default: none, or the constraints whose price is given),
  dual=0 (hide the dual-function panel), labels=1 (start with all of the figure's labels shown;
  by default a label appears while hovering over its object), theme=auto | light | dark (as in the Theme dropdown; auto, the default, follows the system setting;
  e.g. theme=light to force light mode inside Canvas), layout=auto | vertical | horizontal (dual-function panel below the figure,
  or beside it; auto, the default, puts it beside the figure when the window is wide enough; side=1 is
  an alias for horizontal), map=3d | vertex | value (3-D graph, the default; or a 2-D map coloured by optimal extreme point or by the value of h_LP).
  Geometry is set in the CONFIG block in the script below.
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d22;
    --muted: #6b6b75;
    --grid: #eeeef2;
    --axis: #a3a3ad;
    --xlp-fill: #e3ebf7;
    --xlp-stroke: #4f6fa6;
    --feas-fill: #b8cbe8;
    --cons: #55555f;
    --c: #1f5fbf;
    --n1: #d06a10;
    --n2: #7d4cc0;
    --res: #c0264b;
    --pos: #23905a;
    --neg: #d8343a;
    --opt: #111116;
    --halo: #ffffff;
    --star: #f5c518; --star-edge: #111116;
    /* extreme points (dots in the figure, lines/regions in the dual panel) */
    --v0: #e0a030; --v1: #3fa0b0; --v2: #8fb33a; --v3: #c06aa8;
    --v4: #9c755f; --v5: #5b8ad6; --v6: #e07a50; --v7: #7a7a86;
  }
  /* data-theme is set by the script: the Theme dropdown, or ?theme=; Auto follows prefers-color-scheme. */
  :root[data-theme="dark"] {
    --bg: #17171b; --fg: #ececf1; --muted: #a0a0ab; --grid: #26262c; --axis: #5c5c66;
    --xlp-fill: #1f2a3d; --xlp-stroke: #7d9bd1; --feas-fill: #2f4466; --cons: #b5b5bf;
    --c: #6fa4ff; --n1: #f39a4a; --n2: #b48cf0; --res: #ff6688; --pos: #4fcb87; --neg: #ff6b6b;
    --opt: #ffffff; --halo: #17171b; --star: #a67c00; --star-edge: #ffffff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  /* Keep room for the scrollbar, so the page doesn't shift sideways when the dual panel shows or hides */
  html { scrollbar-gutter: stable; }
  /* Sans-serif for text; serif for math (the system, the figures' labels, inline i/sub/sup) */
  :root { --text-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --math-font: "Latin Modern Roman", "CMU Serif", "Cambria", Georgia, serif; }
  body { font-family: var(--text-font); }
  .formula, .uval, .controls label[for], svg text, .wrap i, .wrap sub, .wrap sup { font-family: var(--math-font); }
  .formula label.relax { font-family: var(--text-font); font-size: 0.9em; }
  .wrap { position: relative; max-width: 760px; margin: 0 auto; padding: 12px 16px; box-sizing: border-box; }
  /* Top-right corner: link to the standalone page */
  .corner { position: absolute; top: 8px; right: 12px; z-index: 1; display: flex; gap: 6px; }
  .cbtn { box-sizing: border-box; width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center;
          justify-content: center; border: 1px solid var(--grid); border-radius: 6px; background: var(--bg);
          color: var(--muted); font: inherit; font-size: 16px; line-height: 1; text-decoration: none; cursor: pointer; }
  .cbtn:hover { color: var(--fg); border-color: var(--axis); }
  /* Choice of LP, top left (clear of the corner buttons) */
  .lpchoice { margin: 2px 40px 4px 0; font-size: 0.95rem; color: var(--muted); }
  .lpchoice select { max-width: 100%; padding: 3px 6px; border: 1px solid var(--grid); border-radius: 6px;
                     background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  .lpchoice select:hover { border-color: var(--axis); }
  /* Room for the system (values, objective, 2 constraints, x ∈ X_LP), so the page doesn't jump */
  .formula { display: flex; justify-content: safe center; align-items: flex-start; font-size: 1.05rem; margin: 4px 0 8px; line-height: 1.6; min-height: calc(5 * 1.6em); }
  /* Columns: lhs | min / s. t. | left side | relation | right side | relax checkbox. No column gap, so a
     struck-through constraint is struck continuously; spacing comes from padding and the relation's spaces.
     The objective spans the checkbox column too, so the checkboxes sit just right of their constraints. */
  .formula .f { display: grid; grid-template-columns: auto auto auto auto auto 1fr; align-items: baseline; }
  .formula .h, .formula .op { padding-right: 0.6em; }
  .formula .op { text-align: left; }
  .formula .under { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .formula .under > :last-child { font-size: 0.75em; }
  .formula .l { text-align: right; }
  .formula .obj { grid-column: span 4; }
  .formula .x { padding-left: 0.6em; }
  /* Objective row: the values at x(u) above the terms and factors, one column each so they line up */
  .formula .stk { display: grid; grid-template-rows: auto auto; grid-auto-flow: column; row-gap: 0.4em; justify-items: center; align-items: baseline; white-space: nowrap; }
  .formula .stk.end { justify-items: end; }   /* the value of h_LP(u) and its "=" above the left-hand side's */
  .formula .val { font-size: 0.85em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .formula .val b { color: var(--fg); font-weight: normal; }
  .formula .pl { padding: 0 0.3em; }
  .formula i, svg .it { font-style: italic; }
  svg { width: 100%; height: auto; display: block; user-select: none; }
  svg text { fill: var(--fg); font-size: 17px;
             paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  svg .small { font-size: 14px; fill: var(--muted); }
  /* A label shows while the pointer is over its object (its hover target) or when pinned; a shown
     label can be clicked to pin it (if shown by hovering) or unpin it (if pinned). */
  #fig text { pointer-events: none; }
  #fig text[data-lab]:not(.show) { visibility: hidden; }
  #fig text[data-lab].show { pointer-events: auto; cursor: pointer; }
  #fig .hit { fill: none; stroke: transparent; pointer-events: stroke; }
  #fig .hitarea { fill: transparent; stroke: none; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-bottom: 12px; font-size: 1.05rem; }   /* room for the ticks */
  .controls .track { position: relative; flex: 1; min-width: 120px; display: flex; }
  .controls .track input[type=range] { flex: 1; width: 100%; margin: 0; }
  /* Tick strip under the slider; the insets approximate half the thumb width so ticks line up with values. */
  .ticks { position: absolute; left: 8px; right: 8px; top: 100%; height: 12px; }   /* hangs below the slider */
  .tick { position: absolute; transform: translateX(-50%); top: 0; border: 0; background: none; padding: 0 4px;
          font: inherit; font-size: 11px; line-height: 12px; cursor: pointer; }
  .tick.n1 { color: var(--n1); } .tick.n2 { color: var(--n2); }
  .tick .star { color: var(--fg); font-size: 13px; }
  .controls.off .ticks { display: none; }
  .dual[hidden] { display: none; }
  /* Separated from the sliders below by space and a thin rule */
  .options { margin: 4px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--grid); font-size: 0.95rem; }
  .options summary { cursor: pointer; color: var(--muted); }
  .options label { display: inline-flex; align-items: center; gap: 6px; margin: 6px 20px 0 0; cursor: pointer; }
  .options .btns { display: flex; gap: 8px; margin-top: 8px; }
  .options button { padding: 3px 10px; border: 1px solid var(--grid); border-radius: 6px; background: var(--bg);
                    color: var(--fg); font: inherit; cursor: pointer; }
  .options button:hover { border-color: var(--axis); }
  .options select { padding: 2px 6px; border: 1px solid var(--grid); border-radius: 6px; background: var(--bg);
                    color: var(--fg); font: inherit; cursor: pointer; }
  .options select:hover { border-color: var(--axis); }
  /* "?" beside an option: its note shows while hovering, or stays open after a click (until a click elsewhere) */
  .options .opt { display: inline-flex; align-items: center; margin-right: 20px; }
  .options .opt > label { margin-right: 6px; }
  .help { position: relative; display: inline-flex; margin-top: 6px; }
  .help > button { box-sizing: border-box; width: 18px; height: 18px; padding: 0; border: 1px solid var(--axis);
                   border-radius: 50%; color: var(--muted); font-size: 12px; line-height: 1; }
  .help > button:hover, .help.open > button { color: var(--fg); border-color: var(--fg); }
  .help .pop { display: none; position: absolute; z-index: 2; left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
               width: max-content; max-width: min(280px, 80vw); padding: 8px 10px; border: 1px solid var(--axis);
               border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 0.9rem; line-height: 1.45;
               box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
  .help:hover .pop, .help.open .pop { display: block; }
  .help .pop i { font-family: var(--text-font); }
  /* Slider of a constraint that is not relaxed: greyed out */
  .controls.off label[for], .controls.off .uval, .controls.off input[type=range] { opacity: 0.4; }
  .controls input[type=range]:disabled { cursor: not-allowed; }
  .wrap sub, .wrap sup { line-height: 0; }   /* keep scripts from stretching the line box */
  #u1, .relax1 { accent-color: var(--n1); }
  #u2, .relax2 { accent-color: var(--n2); }
  .formula label.relax { margin-left: 0.3em; cursor: pointer; white-space: nowrap; }
  .formula label.relax input { margin: 0 0.2em 0 0; cursor: pointer; vertical-align: middle; }
  .uval { min-width: 4.5em; font-variant-numeric: tabular-nums; }
  .n1 { color: var(--n1); } .n2 { color: var(--n2); }
  .formula .inactive { opacity: 0.4; text-decoration: line-through; }
  /* Both left-hand sides (h_LP(u) / z_LP) in one cell, only one visible, so the system keeps its size */
  .formula .lhs { display: inline-grid; justify-items: end; }
  .formula .lhs > span { grid-area: 1 / 1; }
  .formula .hid { visibility: hidden; }
  /* A penalty term of a kept constraint is struck through across its columns (and the gaps between them) */
  .formula .stk .inactive { text-decoration: none; justify-self: stretch; text-align: center;
                            background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 100% 1px; }
  .dual { margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 10px; }
  /* Layout "Horizontal": the dual-function panel to the right of the rest; "Auto": the same when the
     window is wide enough, else stacked as in "Vertical". */
  .wrap.horizontal { max-width: 1520px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; }
  /* the dual-function panel beside the figure and controls (the .main column), centred against them */
  .wrap.horizontal > .dual { align-self: center; margin-top: 0; border-top: 0; padding-top: 0; }
  /* the choice of LP and the written-out LP across both columns, centred on the page */
  .wrap.horizontal > .top { grid-column: 1 / -1; }
  .wrap.horizontal .lpchoice { margin: 2px 76px 4px; text-align: center; }
  @media (min-width: 1000px) {
    .wrap.auto { max-width: 1520px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; }
    .wrap.auto > .dual { align-self: center; margin-top: 0; border-top: 0; padding-top: 0; }
    .wrap.auto > .top { grid-column: 1 / -1; }
    .wrap.auto .lpchoice { margin: 2px 76px 4px; text-align: center; }
  }
  #dualfig { touch-action: none; cursor: crosshair; }
  #dualfig.rotate { cursor: grab; }
  #dualfig.rotate:active { cursor: grabbing; }
  .mapmode { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 14px;
             font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
  .mapmode label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .mapmode[hidden] { display: none; }
  #subfig { margin-top: 14px; }
  .dualcap { font-size: 0.9rem; color: var(--muted); text-align: center; line-height: 1.6; margin: 4px 8px 0; }
</style>
</head>
<body>
<div class="wrap" id="page">
  <div class="corner">
    <a class="cbtn" target="_blank" rel="noopener" title="Open in a new tab (GitHub Pages)" aria-label="Open in a new tab (GitHub Pages)"
       href="https://chalmers-mathematical-optimization.github.io/Large-Scale-Optimization-Illustrations/Lagrangean%20Relaxation.html">↗</a>
  </div>
  <div class="top">
  <div class="lpchoice"><label>LP: <select id="lpSelect"></select></label></div>
  <div class="formula" id="formula"></div>
  </div>
  <div class="main">
  <svg id="fig" viewBox="0 0 720 600" role="img" aria-label="Polyhedron X_LP cut by two constraints, with the objective vector, the scaled constraint normals and the resulting Lagrangean objective direction."></svg>
  <details class="options">
    <summary>Options</summary>
    <label><input type="checkbox" id="optVectors" checked> Penalty vectors</label>
    <span class="opt"><label><input type="checkbox" id="optBoxes"> Penalty boxes</label><span class="help">
      <button type="button" aria-label="About penalty boxes" aria-describedby="boxesHelp">?</button>
      <span class="pop" id="boxesHelp" role="tooltip">Shows boxes whose areas correspond to the penalty term(s).<br>
        <i>Note:</i> This is not a common visualization, and is not used elsewhere in the course.</span>
    </span></span>
    <span class="opt"><label><input type="checkbox" id="optFit"> Fit graph</label><span class="help">
      <button type="button" aria-label="About fit graph" aria-describedby="fitHelp">?</button>
      <span class="pop" id="fitHelp" role="tooltip">Scales the graph so all elements are visible.</span>
    </span></span>
    <label>Layout <select id="optLayout">
      <option value="auto">Auto</option>
      <option value="vertical">Vertical</option>
      <option value="horizontal">Horizontal</option>
    </select></label>
    <label>Theme <select id="optTheme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select></label>
    <div class="btns">
      <button type="button" id="showLabels">Show all labels</button>
      <button type="button" id="hideLabels">Hide all labels</button>
    </div>
  </details>
  <div class="controls" id="row1">
    <label for="u1"><i>u</i><sub>1</sub></label>
    <span class="track"><input id="u1" type="range" min="0" max="2.5" step="0.01" value="0"><span class="ticks" id="ticks1"></span></span>
    <span class="uval" id="uval1">= 0.00</span>
  </div>
  <div class="controls" id="row2">
    <label for="u2"><i>u</i><sub>2</sub></label>
    <span class="track"><input id="u2" type="range" min="0" max="2.5" step="0.01" value="0"><span class="ticks" id="ticks2"></span></span>
    <span class="uval" id="uval2">= 0.00</span>
  </div>
  </div>
  <div class="dual" id="dual">
    <div class="mapmode" id="mapmode">
      Mode:
      <label><input type="radio" name="mapmode" value="3d" checked> <span>3D</span></label>
      <label><input type="radio" name="mapmode" value="vertex"> <span>2D (Color by segment)</span></label>
      <label><input type="radio" name="mapmode" value="value"> <span>2D (Color by value of <i>h</i><sub>LP</sub>(<i>u</i>))</span></label>
    </div>
    <svg id="dualfig" viewBox="0 0 720 290" role="img" aria-label="The dual function h_LP plotted against the Lagrangean prices."></svg>
    <div class="dualcap" id="dualcap"></div>
    <svg id="subfig" viewBox="0 0 720 230" role="img" aria-label="The subdifferential of h_LP at u, in subgradient coordinates."></svg>
    <div class="dualcap" id="subcap"></div>
  </div>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- CONFIG
  // Coordinates are in problem space; the view uses equal scaling on both axes.
  const VIEW = { xmin: -2.6, xmax: 10.4, ymin: -1.6, ymax: 8.4 };  // 13 x 10 units, 720 px wide
  // The LPs to choose between (dropdown at the top, or ?lp=1, 2, ...). For each:
  //   XLP:  vertices of X_LP, in order;  C: objective (minimise c^T x), drawn from the origin.
  //   Label positions are preferences: labels move to nearby free spots to avoid overlaps.
  //   XLP_LABEL: in the part of X_LP that violates a constraint;
  //   XLP_OPT_LABEL: preferred direction of the x*_LP label from that point.
  //   CONS: relaxed constraints A_i^T x <= b_i, used as written; A_i (a) is the normal pointing out of the
  //   feasible side. The normal is drawn from the midpoint of the line's segment on the boundary of the
  //   unrelaxed feasible region X_LP ∩ {A_i^T x <= b_i for all i}. labelAt/anchor: fixed label spot.
  const LPS = [
    {
      name: "Optimum in the interior of X_LP",
      XLP: [[1, 1], [7, 0.8], [9.2, 3], [8.5, 6.5], [5, 7.6], [1.5, 6]],
      C: [-2, -1.2],
      XLP_LABEL: [7.8, 5.6],
      XLP_OPT_LABEL: [0.22, 0.2],
      CONS: [
        { a: [1, -0.15], b: 6.5,  labelAt: [7.85, 8.05], anchor: "start" },
        { a: [0.7, 1],   b: 9.25, labelAt: [10.2, 3.7], anchor: "end" },
      ],
    },
    {
      // x*_LP is where constraint 1 crosses the top edge of X_LP. -c is outside cone(A_1, A_2), so no u >= 0
      // has c + u_1 A_1 + u_2 A_2 = 0: the pieces of h_LP (both relaxed) don't all meet in one point.
      name: "Optimum on the boundary of X_LP",
      XLP: [[1, 1], [7, 0.8], [9.2, 3], [8.5, 6.5], [5, 7.6], [1.5, 6]],
      C: [-2, -1.2],
      XLP_LABEL: [8.4, 4.4],
      XLP_OPT_LABEL: [-0.3, 0.4],
      CONS: [
        { a: [1, 0.25],  b: 8.6, labelAt: [8.7, -1.35], anchor: "end" },
        { a: [-0.5, -1], b: -3.5, labelAt: [-2.4, 5.45], anchor: "start" },
      ],
    },
  ];
  // ------------------------------------------------------------------------

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const W = 720, S0 = W / (VIEW.xmax - VIEW.xmin), H = (VIEW.ymax - VIEW.ymin) * S0;
  // Current view. The figure keeps its pixel size; when arrows or boxes need more room than VIEW,
  // fitView() zooms out (S < S0) so that everything fits.
  let S = S0, vx0 = VIEW.xmin, vy1 = VIEW.ymax;
  const viewRect = () => ({ xmin: vx0, xmax: vx0 + W / S, ymin: vy1 - H / S, ymax: vy1 });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const px = p => [(p[0] - vx0) * S, (vy1 - p[1]) * S];
  function fitView(points) {
    const m = 0.5;                                                 // margin (problem units)
    const B = { ...VIEW };
    points.forEach(([x, y]) => {
      B.xmin = Math.min(B.xmin, x - m); B.xmax = Math.max(B.xmax, x + m);
      B.ymin = Math.min(B.ymin, y - m); B.ymax = Math.max(B.ymax, y + m);
    });
    S = Math.min(S0, W / (B.xmax - B.xmin), H / (B.ymax - B.ymin));
    if (S === S0) { vx0 = VIEW.xmin; vy1 = VIEW.ymax; return; }
    vx0 = (B.xmin + B.xmax) / 2 - W / S / 2;                      // centre the enlarged box
    vy1 = (B.ymin + B.ymax) / 2 + H / S / 2;
  }
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const scale = (k, p) => [k * p[0], k * p[1]];
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const VCOL = j => `var(--v${j % 8})`;

  // The current LP (see LPS) and what is derived from it; set by useLP.
  let lpIndex, XLP, C, XLP_LABEL, XLP_OPT_LABEL, CONS, zLP, xLP, cen;
  function useLP(n) {
    lpIndex = n;
    ({ XLP, C, XLP_LABEL, XLP_OPT_LABEL, CONS } = LPS[n]);
    for (const k of CONS) {
      k.n = Math.hypot(k.a[0], k.a[1]);          // ||a||
      k.e = scale(1 / k.n, k.a);                  // unit normal, for geometry only
    }
    // Foot of each normal: midpoint of {A_i^T x = b_i} ∩ X_LP ∩ (the other constraints).
    for (const k of CONS) {
      const poly = CONS.reduce((P, o) => (o === k ? P : clip(P, o.a, o.b)), XLP);
      const eps = 1e-9, f = P => dot(k.a, P) - k.b, hits = [];
      poly.forEach((P, i) => {

  // Constraint as [left side, relation, right side], so the relations line up in the formula.
  const consHtml = (i, ptHtml) => [`<i>A</i><sub>${i + 1}</sub><sup>T</sup>${ptHtml}`, "&nbsp;≤&nbsp;", `<i>b</i><sub>${i + 1}</sub>`];
  // A_j^T x - b_j as HTML for the point ptHtml (e.g. x(u)), and A_j^T x(u) - b_j as SVG label parts.
  const slackHtml = (j, ptHtml) => `<i>A</i><sub>${j}</sub><sup>T</sup>${ptHtml} − <i>b</i><sub>${j}</sub>`;
  const slack = j => [["A", "it"], [j, "sub"], ["T", "sup"], ["x", "it"], ["(", ""], ["u", "it"], [")", ""], [" − ", ""], ["b", "it"], [j, "sub"]];
  // Six-column layout:  lhs | min / s. t. | expression (objective: one cell; constraint: left, relation,
  // right, each with class cls; the objective also spans the next column) | relax-checkbox (constraint rows only)
  const fRow = (lhs, op, expr, extra = "", cls = "") => `<span class="h">${lhs}</span><span class="op">${op}</span>` +
    (Array.isArray(expr)
      ? expr.map((e, n) => `<span class="${["l", "m", "r"][n]}${cls}">${e}</span>`).join("")
      : `<span class="obj">${expr}</span>`) + (Array.isArray(expr) ? `<span class="x">${extra}</span>` : "");
  let showDual = true;

  function render() {
    const R = [0, 1].filter(i => boxes[i].checked);            // relaxed
    const K = [0, 1].filter(i => !boxes[i].checked);           // kept as hard constraints
    // Slider ranges for this choice of relaxed constraints.
    const domain = K.reduce((P, i) => clip(P, CONS[i].a, CONS[i].b), XLP);
    const P = pieces(domain);
    if (R.length) {
      const need = neededPrices(R, P);
      R.forEach(i => {
        sliders[i].max = String(niceMax(need[i]));
        if (+sliders[i].value > +sliders[i].max) sliders[i].value = sliders[i].max;
      });
    }
    // Ticks: the optimal prices (a star, like x*_LP) and the prices where x(u) switches extreme point, i.e.
    // where the dashed line lies along a side of the region and ∂h_LP(u) is more than a point. With both
    // relaxed, these are for moving this slider with the other one kept where it is (they move with it):
    // the other price's term is folded into each extreme point's constant.
    // Clicking a tick sets that slider exactly to it.
    const u = [0, 1].map(i => (R.includes(i) ? parseFloat(sliders[i].value) : 0));
    const opt = R.length ? dualOptima(R, P) : [];
    const breaksFor = i => sweep(P.map(p => p.cv + R.reduce((s, k) => s + (k === i ? 0 : u[k] * p.d[k]), 0)),
                                 P.map(p => p.d[i])).slice(1).map(b => b.t);
    [0, 1].forEach(i => {
      ticks[i].replaceChildren();
      const n = R.indexOf(i);
      if (n < 0) return;
      const marks = new Map();                                     // rounded key -> { v, star }
      breaksFor(i).forEach(v => marks.set(v.toFixed(6), { v, star: false }));
      opt.forEach(uu => marks.set(uu[n].toFixed(6), { v: uu[n], star: true }));
      [...marks.values()].filter(m => m.v <= +sliders[i].max).forEach(({ v, star }) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = `tick n${i + 1}`;
        b.innerHTML = star ? `<span class="star">☆</span>` : "▲";
        b.title = `${star ? "optimal" : "x(u) switches extreme point at"} u${i + 1} = ${fmt(v)}`;
        b.style.left = `${100 * v / +sliders[i].max}%`;
        b.addEventListener("click", () => { sliders[i].step = "any"; sliders[i].value = String(v); render(); });
        ticks[i].appendChild(b);
      });
    });
    [0, 1].forEach(i => {
      const on = R.includes(i);
      sliders[i].disabled = !on;
      rows[i].classList.toggle("off", !on);
      uvals[i].textContent = "= " + (on ? u[i] : +sliders[i].value).toFixed(2);
    });
    const anyU = R.some(i => u[i] > 0);

    // Penalised objective and the optimal extreme point of the subproblem.
    let cu = C.slice();
    R.forEach(i => { cu = add(cu, scale(u[i], CONS[i].a)); });
    const { h, j: best } = evalDual(P, R, u);
    // Several optimal points: at a price where x(u) switches extreme point (one relaxed constraint), or on a
    // ridge of h_LP (both relaxed), a whole edge (the dashed line lies along it); with both relaxed and
    // c + u_1 A_1 + u_2 A_2 = 0, all of X_LP. x(u) can then be dragged within that set; it starts at the
    // tie-break vertex.
    let xs = domain[best];
    const tied = R.length
      ? P.map((p, j) => j).filter(j => P[j].cv + R.reduce((s, i) => s + u[i] * P[j].d[i], 0) <= h + 1e-9 * (1 + Math.abs(h))) : [];
    const flat = R.length === 2 && Math.hypot(cu[0], cu[1]) < 1e-9;
    if (flat || tied.length >= 2) {
      if (flat) tieShape = { poly: domain, has: q => inConvex(domain, q) };
      else {
        // Edge ends: the extreme tied vertices along the edge.
        const dir = [-cu[1], cu[0]], along = tied.map(j => dot(dir, domain[j]));
        const a = domain[tied[along.indexOf(Math.min(...along))]], b = domain[tied[along.indexOf(Math.max(...along))]];
        const ab = [b[0] - a[0], b[1] - a[1]];
        tieShape = { seg: [a, b], has: q => Math.abs(ab[0] * (q[1] - a[1]) - ab[1] * (q[0] - a[0])) < 1e-9 * (1 + dot(ab, ab))
                                         && dot([q[0] - a[0], q[1] - a[1]], ab) >= -1e-9 && dot([q[0] - b[0], q[1] - b[1]], ab) <= 1e-9 };
      }
      const key = JSON.stringify([R, u]);
      if (key !== tieKey) { tieKey = key; tiePt = xs.slice(); }
      xs = tiePt;
    } else { tieKey = null; tieShape = null; }
    svg.style.touchAction = tieShape ? "none" : "";
    // Values at the shown point: c^T x(u) and A_i^T x(u) - b_i.
    const xc = dot(C, xs), xd = CONS.map(k => dot(k.a, xs) - k.b);
    // Subgradients of h_LP at u: g(x) = (A_i^T x - b_i)_{i in R} for optimal x. The subdifferential is the
    // image of the optimal set: the convex hull of g at the optimal extreme points (verts, in domain order).
    const sub = { img: P.map(p => R.map(i => p.d[i])), g: R.map(i => xd[i]),
                  verts: flat ? P.map((p, j) => j) : tied.length >= 2 ? tied : [best] };

    // Zoom out if the arrows (c chain, resultant, penalty arrows) or penalty boxes would leave the view.
    // Points that must be visible when x(u) = q (only what is shown):
    const vecsOn = optVectors.checked, boxesOn = optBoxes.checked;
    const reachFor = q => {
      const pts = [[0, 0], C, cu];
      let acc = C.slice();
      R.forEach(i => {
        const k = CONS[i];
        acc = add(acc, scale(u[i], k.a));
        if (vecsOn) pts.push(acc, add(k.foot, scale(u[i], k.a)));
        if (!boxesOn) return;
        const dist = (dot(k.a, q) - k.b) / k.n, F = add(q, scale(-dist, k.e)), w = u[i] * k.n;
        let t = [-k.e[1], k.e[0]];
        if (dot(t, [q[0] - cen[0], q[1] - cen[1]]) < 0) t = scale(-1, t);
        pts.push(F, add(F, scale(w, t)), add(q, scale(w, t)));
      });
      return pts;
    };
    const bbox = pts => ({ xmin: Math.min(...pts.map(q => q[0])), xmax: Math.max(...pts.map(q => q[0])),
                           ymin: Math.min(...pts.map(q => q[1])), ymax: Math.max(...pts.map(q => q[1])) });
    // The boxes follow x(u), which jumps at prices where another extreme point k takes over. To avoid a
    // sudden jump in zoom, k's boxes also count, with weight exp(-distance / tau), where distance is how
    // far u is (in price space) from where k ties with the current optimum: at the switch both fit.
    const B = bbox(reachFor(xs));
    if (R.length) {
      const tau = 0.05 * Math.max(...R.map(i => +sliders[i].max));
      P.forEach((p, k) => {
        if (k === best) return;
        const gd = Math.hypot(...R.map(i => p.d[i] - P[best].d[i]));
        if (gd < 1e-12) return;
        const hk = p.cv + R.reduce((s2, i) => s2 + u[i] * p.d[i], 0);
        const wgt = Math.exp(-Math.max(0, hk - h) / gd / tau);
        if (wgt < 1e-3) return;
        const Bk = bbox(reachFor(domain[k]));
        B.xmin += wgt * Math.min(0, Bk.xmin - B.xmin); B.xmax += wgt * Math.max(0, Bk.xmax - B.xmax);
        B.ymin += wgt * Math.min(0, Bk.ymin - B.ymin); B.ymax += wgt * Math.max(0, Bk.ymax - B.ymax);
      });
    }
    fitView(optFit.checked ? [[B.xmin, B.ymin], [B.xmax, B.ymax]] : []);   // [] = the normal view
    drawGrid();

    // The feasible region of the current problem (X_LP ∩ kept constraints) in one colour;
    // any part of X_LP cut off by a kept constraint is faded.
    regions.replaceChildren();
    if (K.length) {
      const xlp = el("polygon", { points: pts(XLP), "stroke-width": 2, "stroke-linejoin": "round",
                                  "fill-opacity": 0.35, "stroke-dasharray": "5 4" }, regions);
      xlp.style.fill = "var(--xlp-fill)"; xlp.style.stroke = "var(--xlp-stroke)";
    }
    const d = el("polygon", { points: pts(domain), "stroke-width": 2, "stroke-linejoin": "round" }, regions);
    d.style.fill = "var(--feas-fill)"; d.style.stroke = "var(--xlp-stroke)";
    XLP.forEach((v, n) => hitLine(px(v), px(XLP[(n + 1) % XLP.length]), "X_LP", regions));   // its outline shows its label
    [XLP, ...(K.length ? [domain] : [])].forEach(poly => poly.forEach((v, n) => obSeg(v, poly[(n + 1) % poly.length], 0.5)));
    { const V = viewRect(); obSeg([V.xmin, 0], [V.xmax, 0], 0.3); obSeg([0, V.ymin], [0, V.ymax], 0.3); }
    // Relaxed constraints dashed, kept ones solid.
    CONS.forEach((k, i) => {
      const [p, q] = lineThrough(k.e, k.b / k.n);
      const ln = el("line", { x1: px(p)[0], y1: px(p)[1], x2: px(q)[0], y2: px(q)[1] }, regions);
      ln.style.stroke = `var(${NCOL[i]})`;
      if (R.includes(i)) ln.setAttribute("stroke-dasharray", "8 5");
      ln.setAttribute("stroke-width", R.includes(i) ? 1.6 : 2.2);
      hitLine(px(p), px(q), "k" + (i + 1), regions);
      obSeg(p, q, 0.8);
    });


    dyn.replaceChildren();

    // The optimal edge, when x(u) can be dragged along it.
    if (tieShape && tieShape.seg) {
      const [A, B] = tieShape.seg.map(px);
      const e = el("line", { x1: A[0], y1: A[1], x2: B[0], y2: B[1], "stroke-width": 8, "stroke-linecap": "round", "stroke-opacity": 0.3 }, dyn);
      e.style.stroke = "var(--res)";
    }

    // Extreme points of the subproblem domain, coloured as in the dual panel.
    domain.forEach((v, j) => {
      const [vx, vy] = px(v);
      el("circle", { cx: vx, cy: vy, r: 4.5, "stroke-width": 1.5 }, dyn).style.cssText = `fill:${VCOL(j)};stroke:var(--bg)`;
      obDot(v, 5, 40);
    });

    // Fixed labels: axes, then the optimum markers and constraint labels get first pick.
    const V = viewRect();
    want([["x", "it"], ["1", "sub"]], { class: "small", "data-lab": "ax1" }, fixedAt([V.xmax - 9 / S, -26 / S], "end"));
    want([["x", "it"], ["2", "sub"]], { class: "small", "data-lab": "ax2" }, fixedAt([7 / S, V.ymax - 20 / S]));

    const boxLabels = [];   // queued after the main labels
    // u_i (A_i^T x(u) - b_i) as rectangles: dotted side = distance (A_i^T x(u) - b_i)/||A_i|| from x(u) to line i,
    // other side = u_i ||A_i|| (the length of the penalty arrow) along the line.
    // Red when x(u) violates the constraint (A_i^T x(u) > b_i), green when it satisfies it.
    (boxesOn ? R : []).forEach(i => {
      const k = CONS[i], d = xd[i], dist = d / k.n, w = u[i] * k.n;
      if (Math.abs(dist) < 1e-9) return;
      const col = d > 0 ? "var(--neg)" : "var(--pos)";
      const F = add(xs, scale(-dist, k.e));
      let t = [-k.e[1], k.e[0]];
      if (dot(t, [xs[0] - cen[0], xs[1] - cen[1]]) < 0) t = scale(-1, t);   // extend away from X_LP's centre
      const j = String(i + 1);
      if (w > 1e-9) {
        const rect = [xs, F, add(F, scale(w, t)), add(xs, scale(w, t))];
        const r = el("polygon", { points: pts(rect), "fill-opacity": 0.2, "stroke-width": 1 }, dyn);
        r.style.fill = col; r.style.stroke = col; r.setAttribute("data-hl", "area" + j);
        obSeg(rect[1], rect[2], 0.6); obSeg(rect[3], rect[0], 0.6);
        // The two sides as long as the penalty arrow u_i A_i, in that arrow's colour.
        [xs, F].forEach(p0 => {
          const [x1, y1] = px(p0), [x2, y2] = px(add(p0, scale(w, t)));
          el("line", { x1, y1, x2, y2, "stroke-width": 2.6, "stroke-linecap": "round" }, dyn).style.stroke = `var(${NCOL[i]})`;
          hitLine([x1, y1], [x2, y2], "side" + j, dyn);
          obSeg(p0, add(p0, scale(w, t)), 1.5);
        });
        // Label the side lying on the constraint line (length u_i ||A_i||), preferably outside the box.
        if (w > 0.3) {
          boxLabels.push(() => want([["u", "it"], [j, "it-sub"], [" ‖", ""], ["A", "it"], [j, "sub"], ["‖", ""]], { class: "small", "data-lab": "side" + j },
            L => beside(F, add(F, scale(w, t)), 4, L, [0.5, 0.3, 0.7, 0.15, 0.85], sdir(scale(-dist, k.e)))));
        }
        // The area, inside the box if it fits.
        const rpx = rect.map(px);
        boxLabels.push(() => want([["u", "it"], [j, "it-sub"], ["(", ""], ...slack(j), [")", ""]], { class: "small", "data-lab": "area" + j },
          () => [0.5, 0.35, 0.65, 0.2, 0.8, 0.1, 0.9].map(f => {
            // along the box's midline, so that part of a box running off the view still works
            const m0 = scale(0.5, add(rpx[0], rpx[1])), m1 = scale(0.5, add(rpx[3], rpx[2]));
            return add(m0, scale(f, [m1[0] - m0[0], m1[1] - m0[1]]));
          }),
          b => [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]].every(q => inConvex(rpx, q)), 60));
      }
      const [x1, y1] = px(xs), [x2, y2] = px(F);
      const seg = el("line", { x1, y1, x2, y2, "stroke-width": 2.2, "stroke-dasharray": "1 5", "stroke-linecap": "round" }, dyn);
      seg.style.stroke = col;
      hitLine([x1, y1], [x2, y2], "dist" + j, dyn);
      obSeg(xs, F, 1.5);
      boxLabels.push(() => want([["(", ""], ...slack(j), [") / ‖", ""], ["A", "it"], [j, "sub"], ["‖", ""]], { class: "small", "data-lab": "dist" + j },
        L => beside(xs, F, 4, L, [0.5, 0.35, 0.65, 0.2, 0.8], sdir(scale(-1, t)))));
    });

    // Scaled normals u_i A_i of the relaxed constraints.
    (vecsOn ? R : []).forEach(i => {
      const k = CONS[i];
      arrow(k.foot, add(k.foot, scale(u[i], k.a)), NCOL[i], dyn, { hl: "n" + (i + 1) });
      obSeg(k.foot, add(k.foot, scale(u[i], k.a)), 2.5);
      const [fx, fy] = px(k.foot);
      el("circle", { cx: fx, cy: fy, r: 3, "data-hl": "n" + (i + 1) }, dyn).style.fill = `var(${NCOL[i]})`;
      obDot(k.foot, 4, 30);
    });

    // c, then u_i A_i for each relaxed i appended head to tail (penalty vectors, optional), then the resultant.
    const O = [0, 0];
    let tip = add(O, C);
    arrow(O, tip, "--c", dyn, { width: 3, hl: "c" });
    obSeg(O, tip, 2.5);
    R.forEach(i => {
      const v = scale(u[i], CONS[i].a);
      if (vecsOn) { arrow(tip, add(tip, v), NCOL[i], dyn, { width: 2, dash: "6 4", hl: "n" + (i + 1) }); obSeg(tip, add(tip, v), 2); }
      tip = add(tip, v);
    });
    if (anyU) { arrow(O, tip, "--res", dyn, { width: 3, hl: "res" }); obSeg(O, tip, 2.5); }
    const [cox, coy] = px(O);
    el("circle", { cx: cox, cy: coy, r: 3 }, dyn).style.fill = "var(--fg)";
    obDot(O, 4, 30);

    // Level line of the penalised objective through x(u), and x(u) itself.
    if (Math.hypot(cu[0], cu[1]) > 1e-9) {
      const n = scale(1 / Math.hypot(cu[0], cu[1]), cu);
      const [p, q] = lineThrough(n, dot(n, xs));
      const ll = el("line", { x1: px(p)[0], y1: px(p)[1], x2: px(q)[0], y2: px(q)[1],
                              "stroke-width": 1.6, "stroke-dasharray": "7 5" }, dyn);
      ll.style.stroke = anyU ? "var(--res)" : "var(--c)";
      hitLine(px(p), px(q), anyU ? "res" : "c", dyn);
      obSeg(p, q, 0.8);
    }
    // Optimum of the unrelaxed problem, x*_LP: a yellow five-pointed star.
    const [lx, ly] = px(xLP);
    const star = Array.from({ length: 10 }, (_, n) => {
      const r = n % 2 ? 4.6 : 11, a = -Math.PI / 2 + n * Math.PI / 5;
      return `${(lx + r * Math.cos(a)).toFixed(2)},${(ly + r * Math.sin(a)).toFixed(2)}`;
    }).join(" ");
    const dm = el("polygon", { points: star, "stroke-width": 2, "stroke-linejoin": "round" }, dyn);
    dm.style.fill = "var(--star)"; dm.style.stroke = "var(--star-edge)"; dm.setAttribute("data-hl", "xlp");
    obDot(xLP, 11, 80);

    const [sx, sy] = px(xs);
    const halo = el("circle", { cx: sx, cy: sy, r: 8 }, dyn); halo.style.fill = "var(--halo)";
    const pt = el("circle", { cx: sx, cy: sy, r: 6 }, dyn); pt.style.fill = "var(--opt)";
    // Draggable (several optimal points): a contrasting dot inside, in the background colour.
    if (tieShape) el("circle", { cx: sx, cy: sy, r: 2.4 }, dyn).style.fill = "var(--halo)";
    const atLP = Math.hypot(xs[0] - xLP[0], xs[1] - xLP[1]) <= 1e-6;   // then only x*_LP is labelled
    el("circle", { cx: sx, cy: sy, r: 12, class: "hitarea", "data-hl": (atLP ? "xlp" : "xs") + " hover-xs" }, dyn);
    obDot(xs, 9, 80);

    // Labels, most important first; each takes the free-est of its candidate spots.
    // x(u) prefers the side away from X_LP's centre (and is omitted when it coincides with x*_LP).
    if (!atLP) {
      want([["x", "it"], ["(", ""], ["u", "it"], [")", ""]], { "font-weight": "bold", "data-lab": "xs" },
           L => around(xs, 9, L, sdir([xs[0] - cen[0], xs[1] - cen[1]])));
    }
    want([["x", "it"], ["*", "sup"], ["LP", "sub"]], { "font-weight": "bold", "data-lab": "xlp" }, L => around(xLP, 10, L, sdir(XLP_OPT_LABEL)));
    CONS.forEach((k, i) => {
      const j = String(i + 1);
      // Fixed spot (labels of fixed objects don't move); the text's outline keeps it legible over lines.
      want([["A", "it"], [j, "sub"], ["T", "sup"], ["x", "it"], [" ≤ ", ""], ["b", "it"], [j, "sub"]], { "data-lab": "k" + j, style: `fill:var(${NCOL[i]})` },
           fixedAt(k.labelAt, k.anchor));
    });
    want([["X", "it"], ["LP", "sub"]], { "font-size": 22, "data-lab": "X_LP" }, () => [px(XLP_LABEL)]);
    want([["c", "it"]], { "data-lab": "c" }, L => beside(O, C, 4, L));
    if (Math.hypot(cu[0] - C[0], cu[1] - C[1]) > 0.08) {
      want([["c", "it"], ...R.flatMap(i => [[" + ", ""], ["u", "it"], [String(i + 1), "it-sub"], ["A", "it"], [String(i + 1), "sub"]])], { "data-lab": "res" },
           L => beside(O, tip, 5, L));
    }
    // Normal labels: past the arrow tip, else beside the arrow.
    R.filter(i => vecsOn && u[i] * CONS[i].n > 0.08).forEach(i => {
      const k = CONS[i], tipN = add(k.foot, scale(u[i], k.a));
      want([["u", "it"], [String(i + 1), "it-sub"], [" A", "it"], [String(i + 1), "sub"]], { class: "small", "data-lab": "n" + (i + 1) },
           L => [...around(tipN, 5, L, sdir(k.a), 5), ...beside(k.foot, tipN, 4, L).map((c, n) => [...c, 15 + 3 * n])]);
    });
    boxLabels.forEach(f => f());
    // Coordinates of x(u): only while hovering the point (queued last, so they never push other labels).
    want([["(", ""], [fmt(xs[0]), ""], [", ", ""], [fmt(xs[1]), ""], [")", ""]], { class: "small", "data-lab": "hover-xs" },
         L => around(xs, 9, L, sdir([xs[0] - cen[0], xs[1] - cen[1]])));
    placeLabels(dyn);
    applyHover();

    // Formula for the current relaxation: objective, then kept constraints, then x ∈ X_LP.
    // Both left-hand sides occupy the same cell (only one visible), and every penalty term has the same
    // columns whether relaxed or not, so switching doesn't move the system.
    // Above the objective row, the values at the shown point x(u): h_LP(u) (z_LP), c^T x(u), and for each relaxed constraint
    // u_i · (A_i^T x(u) - b_i), in constraint i's colour. The cells of the objective row are
    // [value, expression, expression's class] triples.
    const xHtml = "<i>x</i>";
    const stk = (cells, cl = "") => `<span class="stk${cl}">` +
      cells.map(([v, e, c = ""]) => `<span class="val">${v}</span><span class="${c}">${e}</span>`).join("") + "</span>";
    const lhs = stk([[`<b>${fmt(h)}</b> =`, `<span class="lhs"><span${R.length ? "" : ' class="hid"'}><i>h</i><sub>LP</sub>(<i>u</i>) =</span>` +
                `<span${R.length ? ' class="hid"' : ""}><i>z</i><sub>LP</sub> =</span></span>`]], " end");
    // Both penalty terms and both constraints are always shown, in their constraint's colour; the inactive
    // one of each pair (penalty of a kept constraint, constraint that is relaxed) is dimmed and struck through.
    const inact = on => (on ? "" : " inactive");
    const obj = [[`<b>${fmt(xc)}</b>`, `<i>c</i><sup>T</sup>${xHtml}`]];
    [0, 1].forEach(i => {
      // A kept constraint's term: values hidden, expression dimmed and struck through.
      const n = `n${i + 1}`, on = R.includes(i), hid = on ? "" : " hid", ex = `${n}${inact(on)}`;
      const v = xd[i], vs = fmt(v);
      obj.push([`<span class="pl${hid}">+</span>`, "+", `pl ${ex}`],
               [`<span class="${n}${hid}">${fmt(u[i])}</span>`, `<i>u</i><sub>${i + 1}</sub>`, ex],
               [`<span class="${hid}">·</span>`, "&nbsp;", ex],
               [`<span class="${n}${hid}">${v < -5e-3 ? `(${vs})` : vs}</span>`, `(${slackHtml(i + 1, xHtml)})`, ex]);
    });
    const stRows = [...[0, 1].map(i => [consHtml(i, xHtml), ` n${i + 1}${inact(K.includes(i))}`]),
                    [[xHtml, "&nbsp;∈&nbsp;", "<i>X</i><sub>LP</sub>"], ""]];
    const relaxBox = i => `<label class="relax"><input type="checkbox" class="relax${i + 1}" data-i="${i}"` +
      `${R.includes(i) ? " checked" : ""}> Relax</label>`;
    formula.innerHTML = `<div class="f">${fRow(lhs, stk([["&nbsp;", `<span class="under"><span>min</span><i>x</i></span>`]]), stk(obj))}` +
      stRows.map(([r, cls], n) => fRow("", n === 0 ? "s. t." : "", r, n < 2 ? relaxBox(n) : "", cls)).join("") + "</div>";

    curOpt = opt;
    renderDual(R, P, u, best, h, sub);
  }

  // ---------------------------------------------------------------- dual-function panel
  const dualBox = document.getElementById("dual");
  const dsvg = document.getElementById("dualfig");
  const dcap = document.getElementById("dualcap");
  const DW = 720, DH = 290;
  let pick = null;                  // (x, y) in panel coordinates -> sets sliders
  let pickArea = null;              // [x0, y0, x1, y1] where a drag may start
  let mapCache = { key: null, url: null };
  const RAMP = ["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"];   // viridis, low -> high
  const modeBox = document.getElementById("mapmode");
  let mapMode = "3d";                                              // dual map: "3d" | "vertex" | "value"

  const niceStep = span => {
    const raw = span / 5, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  };
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const rgb = hex => {
    let h = hex.replace("#", "");
    if (h.length === 3) h = [...h].map(c => c + c).join("");
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const mix = (a, b, t) => a.map((v, i) => Math.round(v * (1 - t) + b[i] * t));
  const dline = (x1, y1, x2, y2, stroke, w = 1, extra = {}) => {
    const e = el("line", { x1, y1, x2, y2, "stroke-width": w, ...extra }, dsvg);
    e.style.stroke = stroke;
    return e;
  };

  function renderDual(R, P, u, best, h, sub) {
    dsvg.replaceChildren();
    pick = null; pickArea = null;
    dualBox.hidden = !showDual || !R.length;
    if (dualBox.hidden) return;
    modeBox.hidden = true;
    lastDual = [R, P, u, best, h, sub]; grab3d = null;
    const in3d = R.length === 2 && mapMode === "3d";
    dsvg.classList.toggle("rotate", in3d);
    (R.length === 1 ? dual1D : in3d ? dual3D : dual2D)(R, P, u, best, h, sub);
    renderSub(R, P, u, h, sub);
  }
  // Optimal prices (from dualOptima) and setting a slider to a price; picking within a few pixels of an
  // optimum in the dual panel snaps to it exactly (step "any"), so that the kink there can be reached.
  let curOpt = [];
  const setU = (n, v, exact) => { sliders[n].step = exact ? "any" : "0.01"; sliders[n].value = exact ? String(v) : v.toFixed(2); };

  // ---- The subdifferential ∂h_LP(u) in subgradient coordinates g = (A_i^T x - b_i)_{i in R}: a number
  // line (one relaxed constraint) or a plane (both), equally scaled, fitted to g of the whole domain.
  const ssvg = document.getElementById("subfig"), scap = document.getElementById("subcap");
  function renderSub(R, P, u, h, sub) {
    ssvg.replaceChildren();
    const one = R.length === 1, SW = 720, SH = one ? 84 : 230;
    ssvg.setAttribute("viewBox", `0 0 ${SW} ${SH}`);
    const G = sub.img, gs = sub.verts.map(j => G[j]);
    const span = n => {
      const v = [0, ...G.map(g => g[n])], lo = Math.min(...v), hi = Math.max(...v), pad = 0.1 * (hi - lo || 1);
      return [lo - pad, hi + pad];
    };
    const [l0, h0] = span(0), [l1, h1] = one ? [0, 0] : span(1);
    const X0 = one ? 110 : 200, X1 = one ? 560 : 520, Y0 = 14, Y1 = SH - 18;
    const k = one ? (X1 - X0) / (h0 - l0) : Math.min((X1 - X0) / (h0 - l0), (Y1 - Y0) / (h1 - l1));
    const ox = (X0 + X1) / 2 - k * (l0 + h0) / 2, oy = one ? 30 : (Y0 + Y1) / 2 + k * (l1 + h1) / 2;
    const gp = g => [ox + k * g[0], one ? oy : oy - k * g[1]];
    const ptsG = list => list.map(g => gp(g).map(v => v.toFixed(1)).join(",")).join(" ");
    const slackParts = i => [["A", "it"], [String(i + 1), "sub"], ["T", "sup"], ["x", "it"], [" − ", ""], ["b", "it"], [String(i + 1), "sub"]];
    const seg = (a, b, stroke, w, extra = {}) => {
      const e = el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], "stroke-width": w, "stroke-linecap": "round", ...extra }, ssvg);
      e.style.stroke = stroke;
      return e;
    };

    // Axes through g = 0, labelled with the constraint they measure.
    const [zx, zy] = gp([0, 0]);
    if (one) {
      seg([X0 - 30, oy], [X1 + 30, oy], "var(--axis)", 1.2);
      labelPx(X1 + 38, oy + 5, slackParts(R[0]), { style: `fill:var(${NCOL[R[0]]})` }, ssvg);
    } else {
      seg([X0 - 30, zy], [X1 + 30, zy], "var(--axis)", 1.2);
      seg([zx, Y0 - 6], [zx, Y1 + 6], "var(--axis)", 1.2);
      labelPx(X1 + 38, zy + 5, slackParts(R[0]), { style: `fill:var(${NCOL[R[0]]})` }, ssvg);
      labelPx(zx - 10, Y0 + 6, slackParts(R[1]), { "text-anchor": "end", style: `fill:var(${NCOL[R[1]]})` }, ssvg);
    }
    // g over the whole domain (light), and the subdifferential (dark).
    if (one) {
      const v = G.map(g => g[0]);
      seg(gp([Math.min(...v)]), gp([Math.max(...v)]), "var(--feas-fill)", 12);
      const s = gs.map(g => g[0]);
      if (gs.length >= 2) seg(gp([Math.min(...s)]), gp([Math.max(...s)]), "var(--fg)", 12, { "stroke-opacity": 0.35 });
    } else {
      const img = el("polygon", { points: ptsG(G), "stroke-width": 1.5, "stroke-linejoin": "round" }, ssvg);
      img.style.fill = "var(--feas-fill)"; img.style.stroke = "var(--xlp-stroke)";
      if (gs.length >= 3) {
        const d = el("polygon", { points: ptsG(gs), "fill-opacity": 0.3, "stroke-width": 2, "stroke-linejoin": "round" }, ssvg);
        d.style.fill = "var(--fg)"; d.style.stroke = "var(--fg)";
      } else if (gs.length === 2) seg(gp(gs[0]), gp(gs[1]), "var(--fg)", 7, { "stroke-opacity": 0.4 });
    }
    // Extreme points (coloured as in the figure), the origin, and g(x(u)).
    G.forEach((g, j) => {
      const [x, y] = gp(g);
      el("circle", { cx: x, cy: y, r: 4.5, "stroke-width": 1.5 }, ssvg).style.cssText = `fill:${VCOL(j)};stroke:var(--bg)`;
    });
    if (one) {
      seg([zx, oy - 9], [zx, oy + 9], "var(--fg)", 1.5);
      labelPx(zx, oy + 26, [["0", ""]], { "text-anchor": "middle", class: "small" }, ssvg);
    } else {
      el("circle", { cx: zx, cy: zy, r: 4, fill: "none", "stroke-width": 1.5 }, ssvg).style.stroke = "var(--fg)";
      labelPx(zx - 7, zy + 17, [["0", ""]], { "text-anchor": "end", class: "small" }, ssvg);
    }
    const [cx, cy] = gp(sub.g);
    el("circle", { cx, cy, r: 8 }, ssvg).style.fill = "var(--halo)";
    el("circle", { cx, cy, r: 5.5 }, ssvg).style.fill = "var(--opt)";
    labelPx(one ? SW / 2 : 40, one ? SH - 4 : Y1 + 4,
      [["g", "it"], ["(", ""], ["x", "it"], ["(", ""], ["u", "it"], [")) = ", ""], [one ? fmt(sub.g[0]) : `(${fmt(sub.g[0])}, ${fmt(sub.g[1])})`, ""]],
      { "text-anchor": one ? "middle" : "start" }, ssvg);

    // u is optimal iff some subgradient g has g_i = 0 where u_i > 0 and g_i <= 0 where u_i = 0.
    const wOf = o => { const w = [0, 0]; R.forEach((i, n) => { w[i] = o[n]; }); return w; };
    const top = curOpt.length ? Math.max(...curOpt.map(o => evalDual(P, R, wOf(o)).h)) : Infinity;
    const isOpt = h >= top - 1e-9 * (1 + Math.abs(top));
    scap.innerHTML =
      `Subgradients <i>g</i>(<i>x</i>) = (<i>A</i><sub><i>i</i></sub><sup>T</sup><i>x</i> − <i>b</i><sub><i>i</i></sub>)<sub><i>i</i> relaxed</sub>. ` +
      `Light: <i>g</i>(<i>x</i>) for every feasible <i>x</i> of the subproblem (dots: its extreme points). ` +
      `Dark: the subdifferential ∂<i>h</i><sub>LP</sub>(<i>u</i>), <i>g</i> of the optimal <i>x</i>; black: <i>g</i>(<i>x</i>(<i>u</i>))` +
      (gs.length >= 2 ? ", which moves as <i>x</i>(<i>u</i>) is dragged in the figure." : ".") +
      (!isOpt ? "" : R.every(i => u[i] > 1e-12)
        ? " Since 0 ∈ ∂<i>h</i><sub>LP</sub>(<i>u</i>), <i>u</i> is optimal."
        : " <i>u</i> is optimal: some subgradient has <i>g</i><sub><i>i</i></sub> ≤ 0 where <i>u</i><sub><i>i</i></sub> = 0 and <i>g</i><sub><i>i</i></sub> = 0 where <i>u</i><sub><i>i</i></sub> &gt; 0.");
  }

  // ---- 3-D graph of h_LP over (u_1, u_2), rotated by dragging.
  // h_LP is piecewise linear: on the region where extreme point j is optimal it equals h_j, so the
  // surface is drawn exactly as those regions (convex polygons in u-space) lifted to height h_j.
  let lastDual = null, faceCache = { key: null };
  let grab3d = null;              // screen position of the current point, and screen -> u on the surface
  const view3d = { az: 0.6, el: 0.55 };                         // radians; changed by dragging
  function faces3d(R, P, U) {
    const key = JSON.stringify([R, P.map(p => p.v), U]);
    if (faceCache.key === key) return faceCache;
    const g = P.map(p => [p.d[R[0]], p.d[R[1]]]);
    const hj = (j, w) => P[j].cv + g[j][0] * w[0] + g[j][1] * w[1];
    const faces = [];
    P.forEach((p, j) => {
      let poly = [[0, 0], [U[0], 0], [U[0], U[1]], [0, U[1]]];
      P.forEach((q, k) => {           // keep where h_j <= h_k:  (g_j - g_k)·u <= c_k - c_j
        if (k !== j && poly.length) poly = clip(poly, [g[j][0] - g[k][0], g[j][1] - g[k][1]], q.cv - p.cv);
      });
      const area = poly.reduce((a, v, n) => { const w = poly[(n + 1) % poly.length]; return a + v[0] * w[1] - w[0] * v[1]; }, 0) / 2;
      if (poly.length >= 3 && Math.abs(area) > 1e-9) faces.push({ j, poly, g: g[j], hv: poly.map(w => hj(j, w)) });
    });
    const all = faces.flatMap(f => f.hv), lo = Math.min(...all), hi = Math.max(...all);
    let top = null;
    faces.forEach(f => f.poly.forEach((w, n) => { if (!top || f.hv[n] > top[2]) top = [w[0], w[1], f.hv[n]]; }));
    faceCache = { key, faces, lo, hi, top, step: niceStep((hi - lo) / 1.6) };
    return faceCache;
  }

  function dual3D(R, P, u, best, h, sub) {
    const U = [+sliders[0].max, +sliders[1].max];
    const F = faces3d(R, P, U), { lo, hi } = F, ZS = 1.1;
    modeBox.hidden = false;
    // World coordinates: u in [-1, 1]^2, height in [-ZS/2, ZS/2]; then rotate (azimuth) and tilt (elevation).
    const ca = Math.cos(view3d.az), sa = Math.sin(view3d.az), ce = Math.cos(view3d.el), se = Math.sin(view3d.el);
    const SC = 100, CX = DW / 2, CY = 138;
    const proj = ([u1, u2, hv]) => {
      const X = 2 * u1 / U[0] - 1, Y = 2 * u2 / U[1] - 1, Z = ZS * ((hv - lo) / (hi - lo || 1) - 0.5);
      const x = X * ca - Y * sa, y = X * sa + Y * ca;                // y points away from the viewer
      return { x: CX + SC * x, y: CY - SC * (Z * ce + y * se), depth: y * ce - Z * se };
    };
    const floor = lo - 0.08 * (hi - lo);
    const P2 = q => { const r = proj(q); return `${r.x.toFixed(1)},${r.y.toFixed(1)}`; };
    const line = (a, b, stroke, w = 1, extra = {}) => {
      const A = proj(a), B = proj(b);
      return dline(A.x, A.y, B.x, B.y, stroke, w, extra);
    };

    // Floor, and the vertical axis at the floor corner farthest from the viewer.
    const corners = [[0, 0], [U[0], 0], [U[0], U[1]], [0, U[1]]];
    const fl = el("polygon", { points: corners.map(c => P2([c[0], c[1], floor])).join(" "), "stroke-width": 1 }, dsvg);
    fl.style.fill = "var(--grid)"; fl.style.stroke = "var(--axis)";
    const back = corners.reduce((a, c) => (proj([...c, floor]).depth > proj([...a, floor]).depth ? c : a));
    line([...back, floor], [...back, hi], "var(--axis)", 1);
    const bot = proj([...back, floor]);
    labelPx(bot.x + 6, bot.y + 4, [[fmt(lo), ""]], { class: "small" }, dsvg);   // may be hidden by the surface
    // Current u on the floor.
    const fu = proj([u[0], u[1], floor]);
    el("circle", { cx: fu.x, cy: fu.y, r: 3 }, dsvg).style.fill = "var(--muted)";

    // Faces, farthest first, each shaded by its slope and followed by its level-curve segments.
    const L = [-0.35, -0.55, 0.76];                                  // light direction (world)
    const shaded = (j, gr) => {
      const zx = gr[0] * U[0] / 2 * ZS / (hi - lo || 1), zy = gr[1] * U[1] / 2 * ZS / (hi - lo || 1);
      const n = [-zx, -zy, 1], nn = Math.hypot(...n);
      const lit = Math.max(0, (n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / nn);
      const c = mix(rgb(cssVar(`--v${j % 8}`)), [0, 0, 0], 0.45 * (1 - lit));
      return `rgb(${c.join(",")})`;
    };
    F.faces
      .map(f => ({ f, d: f.poly.reduce((a, w, n) => a + proj([w[0], w[1], f.hv[n]]).depth, 0) / f.poly.length }))
      .sort((a, b) => b.d - a.d)
      .forEach(({ f }) => {
        const poly = el("polygon", { points: f.poly.map((w, n) => P2([w[0], w[1], f.hv[n]])).join(" "),
                                     "stroke-width": 1, "stroke-linejoin": "round" }, dsvg);
        poly.style.fill = shaded(f.j, f.g); poly.style.stroke = "var(--bg)";
        for (let lv = Math.ceil(lo / F.step) * F.step; lv < hi; lv += F.step) {
          const cut = [];
          f.poly.forEach((w, n) => {
            const m = (n + 1) % f.poly.length, a = f.hv[n] - lv, b = f.hv[m] - lv;
            if (a * b < 0) { const t = a / (a - b), w2 = f.poly[m]; cut.push([w[0] + t * (w2[0] - w[0]), w[1] + t * (w2[1] - w[1]), lv]); }
          });
          if (cut.length === 2) line(cut[0], cut[1], "var(--fg)", 1, { "stroke-opacity": 0.35 });
        }
      });

    // Supporting plane at u with gradient g(x(u)), over a patch around u; it tilts as x(u) is dragged.
    const patch = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => {
      const w = [clamp(u[0] + 0.22 * a * U[0], 0, U[0]), clamp(u[1] + 0.22 * b * U[1], 0, U[1])];
      return [w[0], w[1], h + sub.g[0] * (w[0] - u[0]) + sub.g[1] * (w[1] - u[1])];
    });
    const sp = el("polygon", { points: patch.map(P2).join(" "), "fill-opacity": 0.22, "stroke-width": 1.2, "stroke-linejoin": "round" }, dsvg);
    sp.style.fill = "var(--fg)"; sp.style.stroke = "var(--fg)";

    // Maximum (ring) and the current point on the surface.
    if (F.top) {
      const t = proj(F.top);
      el("circle", { cx: t.x, cy: t.y, r: 6, fill: "none", "stroke-width": 2 }, dsvg).style.stroke = "var(--fg)";
    }
    const cu3 = proj([u[0], u[1], h]);
    el("circle", { cx: cu3.x, cy: cu3.y, r: 8 }, dsvg).style.fill = "var(--halo)";
    el("circle", { cx: cu3.x, cy: cu3.y, r: 5.5 }, dsvg).style.fill = "var(--opt)";
    // Dragging the point: on face j the surface is the plane h = c_j + g_j·u, so screen position is
    // affine in u and can be inverted; repeat with the face found at the result if that differs.
    const onFace = (j, sx, sy) => {
      const g = [P[j].d[R[0]], P[j].d[R[1]]], F3 = (a, b) => proj([a, b, P[j].cv + g[0] * a + g[1] * b]);
      const A = F3(0, 0), B = F3(1, 0), C2 = F3(0, 1);
      const m = [B.x - A.x, C2.x - A.x, B.y - A.y, C2.y - A.y], det = m[0] * m[3] - m[1] * m[2];
      if (Math.abs(det) < 1e-6) return null;                     // face seen edge-on
      const rx = sx - A.x, ry = sy - A.y;
      return [clamp((rx * m[3] - m[1] * ry) / det, 0, U[0]), clamp((m[0] * ry - m[2] * rx) / det, 0, U[1])];
    };
    grab3d = {
      x: cu3.x, y: cu3.y,
      toU: (sx, sy) => {
        for (const o of curOpt) {                                  // snap to an optimum
          const q = proj([o[0], o[1], evalDual(P, R, o).h]);
          if (Math.hypot(q.x - sx, q.y - sy) < 9) return { w: o, exact: true };
        }
        let j = best, w = null;
        for (let it = 0; it < 4; it++) {
          const nw = onFace(j, sx, sy);
          if (!nw) break;
          w = nw;
          const uu = [0, 0]; uu[R[0]] = w[0]; uu[R[1]] = w[1];
          const nj = evalDual(P, R, uu).j;
          if (nj === j) break;
          j = nj;
        }
        return w && { w, exact: false };
      },
    };

    // Axis labels on the floor edges nearest the viewer, just outside the floor; h_LP atop the vertical axis.
    const lab = (q, parts, attrs = {}) => { const r = proj(q); labelPx(r.x, r.y + 5, parts, { "text-anchor": "middle", ...attrs }, dsvg); };
    const near = (a, b) => (proj(a).depth < proj(b).depth ? a : b);
    const e1 = near([U[0] / 2, 0, floor], [U[0] / 2, U[1], floor])[1];   // u_2 value of the u_1 edge
    const e2 = near([0, U[1] / 2, floor], [U[0], U[1] / 2, floor])[0];   // u_1 value of the u_2 edge
    const o1 = e1 === 0 ? -0.14 * U[1] : 1.14 * U[1], o2 = e2 === 0 ? -0.14 * U[0] : 1.14 * U[0];
    lab([U[0] / 2, o1, floor], [["u", "it"], ["1", "it-sub"]]);
    lab([o2, U[1] / 2, floor], [["u", "it"], ["2", "it-sub"]]);
    [0, U[0]].forEach(v => lab([v, o1, floor], [[String(+v.toFixed(2)), ""]], { class: "small" }));
    [0, U[1]].forEach(v => lab([o2, v, floor], [[String(+v.toFixed(2)), ""]], { class: "small" }));
    const top = proj([...back, hi]);
    labelPx(top.x, top.y - 8, [["h", "it"], ["LP", "sub"], [` ${fmt(hi)}`, ""]], { "text-anchor": "middle", class: "small" }, dsvg);

    dcap.innerHTML =
      `3D graph of <i>h</i><sub>LP</sub>(<i>u</i>); each face corresponds to one optimal extreme point. ` +
      `Level curves for <i>h</i><sub>LP</sub> shown at every ${fmt(F.step)}. Drag the point to set <i>u</i>; drag elsewhere to rotate. ` +
      `The gray plane is a supporting plane, with gradient <i>g</i>(<i>x</i>(<i>u</i>)).`;
  }

  // One relaxed constraint: one line per extreme point, h_LP is their lower envelope.
  function dual1D(R, P, u, best, h, sub) {
    const i = R[0], U = +sliders[i].max;
    const X0 = 70, X1 = 690, Y0 = 18, Y1 = 248;
    const N = 250, env = [];
    for (let s = 0; s <= N; s++) {
      const uu = Array(2).fill(0); uu[i] = U * s / N;
      env.push(evalDual(P, R, uu).h);
    }
    let lo = Math.min(...env), hi = Math.max(...env, zLP);
    const pad = 0.08 * (hi - lo || 1); lo -= pad; hi += pad;
    const sx = v => X0 + (X1 - X0) * v / U, sy = v => Y1 - (Y1 - Y0) * (v - lo) / (hi - lo);

    el("defs", {}, dsvg).innerHTML = `<clipPath id="dclip"><rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}"/></clipPath>`;
    const ut = U <= 3 ? 0.5 : niceStep(U);
    for (let t = 0; t <= U + 1e-9; t += ut) {
      dline(sx(t), Y0, sx(t), Y1, "var(--grid)");
      labelPx(sx(t), Y1 + 18, [[String(+t.toFixed(2)), ""]], { "text-anchor": "middle", class: "small" }, dsvg);
    }
    const st = niceStep(hi - lo);
    for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) {
      dline(X0, sy(t), X1, sy(t), "var(--grid)");
      labelPx(X0 - 8, sy(t) + 5, [[String(+t.toFixed(6)), ""]], { "text-anchor": "end", class: "small" }, dsvg);
    }
    const g = el("g", { "clip-path": "url(#dclip)" }, dsvg);
    // z_LP (= max h_LP by LP duality, if attained within the slider range)
    const zl = el("line", { x1: X0, y1: sy(zLP), x2: X1, y2: sy(zLP), "stroke-width": 1.4, "stroke-dasharray": "6 4" }, g);
    zl.style.stroke = "var(--muted)";
    P.forEach((p, j) => {
      const e = el("line", { x1: sx(0), y1: sy(p.cv), x2: sx(U), y2: sy(p.cv + U * p.d[i]),
                             "stroke-width": j === best ? 3.2 : 1.4, "stroke-opacity": j === best ? 1 : 0.75 }, g);
      e.style.stroke = VCOL(j);
    });
    const envPts = env.map((v, s) => `${sx(U * s / N).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");
    const pl = el("polyline", { points: envPts, fill: "none", "stroke-width": 2, "stroke-linejoin": "round" }, g);
    pl.style.stroke = "var(--fg)";
    // Supporting lines at u: their slopes are the subgradients, a fan at a kink (shaded); the one with
    // slope g(x(u)) is drawn, and tilts as x(u) is dragged along the optimal edge.
    const sl = sub.verts.map(j => P[j].d[i]), s0 = Math.min(...sl), s1 = Math.max(...sl), D = 0.3 * U, Df = 0.1 * U;
    const at = (w, s) => [sx(w), sy(h + s * (w - u[i]))].map(v => v.toFixed(1)).join(",");
    if (s1 - s0 > 1e-9) {
      const fan = el("polygon", { points: [at(u[i], 0), at(u[i] + Df, s1), at(u[i] + Df, s0), at(u[i], 0), at(u[i] - Df, s0), at(u[i] - Df, s1)].join(" "),
                                  "fill-opacity": 0.15, "stroke-opacity": 0.5, "stroke-width": 1 }, g);
      fan.style.fill = "var(--fg)"; fan.style.stroke = "var(--fg)";
    }
    const [ta, tb] = [at(u[i] - D, sub.g[0]), at(u[i] + D, sub.g[0])].map(s => s.split(","));
    el("line", { x1: ta[0], y1: ta[1], x2: tb[0], y2: tb[1], "stroke-width": 1.6 }, g).style.stroke = "var(--fg)";
    const fr = el("rect", { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0, fill: "none", "stroke-width": 1 }, dsvg);
    fr.style.stroke = "var(--axis)";
    labelPx(X1 - 6, sy(zLP) + 16, [["z", "it"], ["LP", "sub"]], { "text-anchor": "end", class: "small" }, dsvg);
    labelPx(X1 + 8, Y1 + 5, [["u", "it"], [String(i + 1), "it-sub"]], {}, dsvg);
    labelPx(X0 - 8, Y0 - 2, [["h", "it"], ["LP", "sub"]], { "text-anchor": "end" }, dsvg);

    const cx = sx(u[i]), cy = sy(h);
    dline(cx, cy, cx, Y1, "var(--muted)", 1, { "stroke-dasharray": "3 3" });
    el("circle", { cx, cy, r: 8 }, dsvg).style.fill = "var(--halo)";
    el("circle", { cx, cy, r: 5.5 }, dsvg).style.fill = "var(--opt)";

    pickArea = [X0 - 10, Y0 - 10, X1 + 10, Y1 + 10];
    pick = (x) => {
      const o = curOpt.find(o => Math.abs(sx(o[0]) - x) < 7);
      setU(i, o ? o[0] : clamp(U * (x - X0) / (X1 - X0), 0, U), !!o);
    };
    dcap.innerHTML =
      `Colored lines correspond to optimal extreme points. Set <i>u</i> by clicking. ` +
      `The black line through the point is a supporting line; at a kink, the shaded fan holds all of them.`;
  }

  // Both relaxed: map over (u_1, u_2), coloured by the optimal extreme point, with level curves of h_LP.
  function dual2D(R, P, u, best, h) {
    const U = [+sliders[0].max, +sliders[1].max];
    const SIDE = 240, X0 = (DW - SIDE) / 2, Y0 = 14;
    const sx = v => X0 + SIDE * v / U[0], sy = v => Y0 + SIDE * (1 - v / U[1]);
    const key = JSON.stringify([P.map(p => p.v), U, mapMode, cssVar("--bg"), cssVar("--fg")]);
    if (mapCache.key !== key) mapCache = { key, ...buildMap(R, P, U, mapMode) };
    modeBox.hidden = false;
    // Value mode: vertical colour bar to the right of the map, low at the bottom.
    if (mapMode === "value") {
      const BX = X0 + SIDE + 56, BW = 12;
      el("defs", {}, dsvg).innerHTML = `<linearGradient id="hramp" x1="0" y1="1" x2="0" y2="0">` +
        RAMP.map((c, n) => `<stop offset="${n / (RAMP.length - 1)}" stop-color="${c}"/>`).join("") + "</linearGradient>";
      const bar = el("rect", { x: BX, y: Y0, width: BW, height: SIDE, fill: "url(#hramp)", "stroke-width": 1 }, dsvg);
      bar.style.stroke = "var(--axis)";
      labelPx(BX + BW + 6, Y0 + 5, [[fmt(mapCache.hi), ""]], { class: "small" }, dsvg);
      labelPx(BX + BW + 6, Y0 + SIDE + 5, [[fmt(mapCache.lo), ""]], { class: "small" }, dsvg);
      labelPx(BX + BW + 6, Y0 + SIDE / 2 + 5, [["h", "it"], ["LP", "sub"]], { class: "small" }, dsvg);
    }

    if (mapCache.url) el("image", { href: mapCache.url, x: X0, y: Y0, width: SIDE, height: SIDE, preserveAspectRatio: "none" }, dsvg);
    const ut = U.map(v => (v <= 3 ? 0.5 : niceStep(v)));
    for (let t = 0; t <= U[0] + 1e-9; t += ut[0]) {
      labelPx(sx(t), Y0 + SIDE + 18, [[String(+t.toFixed(2)), ""]], { "text-anchor": "middle", class: "small" }, dsvg);
    }
    for (let t = 0; t <= U[1] + 1e-9; t += ut[1]) {
      labelPx(X0 - 8, sy(t) + 5, [[String(+t.toFixed(2)), ""]], { "text-anchor": "end", class: "small" }, dsvg);
    }
    const fr = el("rect", { x: X0, y: Y0, width: SIDE, height: SIDE, fill: "none", "stroke-width": 1 }, dsvg);
    fr.style.stroke = "var(--axis)";
    labelPx(X0 + SIDE + 10, Y0 + SIDE + 5, [["u", "it"], ["1", "it-sub"]], {}, dsvg);
    labelPx(X0 - 30, Y0 + 12, [["u", "it"], ["2", "it-sub"]], { "text-anchor": "end" }, dsvg);

    curOpt.forEach(o => {
      const ring = el("circle", { cx: sx(o[0]), cy: sy(o[1]), r: 6, fill: "none", "stroke-width": 2 }, dsvg);
      ring.style.stroke = "var(--fg)";
    });
    const cx = sx(u[0]), cy = sy(u[1]);
    el("circle", { cx, cy, r: 8 }, dsvg).style.fill = "var(--halo)";
    el("circle", { cx, cy, r: 5.5 }, dsvg).style.fill = "var(--opt)";

    pickArea = [X0 - 10, Y0 - 10, X0 + SIDE + 10, Y0 + SIDE + 10];
    pick = (x, y) => {
      const o = curOpt.find(o => Math.hypot(sx(o[0]) - x, sy(o[1]) - y) < 9);
      setU(0, o ? o[0] : clamp(U[0] * (x - X0) / SIDE, 0, U[0]), !!o);
      setU(1, o ? o[1] : clamp(U[1] * (1 - (y - Y0) / SIDE), 0, U[1]), !!o);
    };
    dcap.innerHTML =
      (mapMode === "value"
        ? `Color corresponds to the value of <i>h</i><sub>LP</sub>(<i>u</i>), from low (dark) to high (yellow). `
        : `Color corresponds to optimal extreme point. `) +
      `Level curves for <i>h</i><sub>LP</sub> shown at every ${fmt(mapCache.step || 0)}. Set <i>u</i> by clicking.`;
  }

  // Raster of the 2-D dual map (data URL) and the contour step.
  function buildMap(R, P, U, mode) {
    const N = 360;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext && canvas.getContext("2d");
    const hv = new Float64Array(N * N), jv = new Int16Array(N * N);
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const uu = [U[0] * (c + 0.5) / N, U[1] * (1 - (r + 0.5) / N)];
        const { h, j } = evalDual(P, R, uu);
        hv[r * N + c] = h; jv[r * N + c] = j;
      }
    }
    let lo = Infinity, hi = -Infinity;
    for (const v of hv) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    const step = niceStep((hi - lo) / 1.6);
    if (!ctx) return { url: null, step, lo, hi };

    canvas.width = canvas.height = N;
    const img = ctx.createImageData(N, N);
    const bg = rgb(cssVar("--bg")), fg = rgb(cssVar("--fg"));
    const cols = P.map((_, j) => mix(bg, rgb(cssVar(`--v${j % 8}`)), 0.45));
    const band = v => Math.floor(v / step);
    const valueCol = v => {                                        // position in [0, 1] -> colour on RAMP
      const x = clamp(v, 0, 1) * (RAMP.length - 1), n = Math.min(Math.floor(x), RAMP.length - 2);
      return mix(rgb(RAMP[n]), rgb(RAMP[n + 1]), x - n);
    };
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const k = r * N + c;
        let col = mode === "value" ? valueCol((hv[k] - lo) / (hi - lo || 1)) : cols[jv[k]];
        const right = c + 1 < N ? k + 1 : k, down = r + 1 < N ? k + N : k;
        if (jv[right] !== jv[k] || jv[down] !== jv[k]) col = mix(col, fg, 0.55);          // region border
        else if (band(hv[right]) !== band(hv[k]) || band(hv[down]) !== band(hv[k])) col = mix(col, fg, 0.3);  // level curve
        img.data.set([...col, 255], 4 * k);
      }
    }
    ctx.putImageData(img, 0, 0);
    return { url: canvas.toDataURL(), step, lo, hi };
  }

  function toPanel(e) {
    const pt = dsvg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(dsvg.getScreenCTM().inverse());
  }
  function dualPointer(e) {
    if (!pick) return;
    const p = toPanel(e);
    pick(p.x, p.y);
    render();
  }
  let dragging = false, rotating = null, moving3d = false;
  const nearPoint3d = p => grab3d && Math.hypot(p.x - grab3d.x, p.y - grab3d.y) < 14;
  dsvg.addEventListener("pointerdown", e => {
    if (dsvg.classList.contains("rotate")) {                         // 3-D: drag the point, else rotate
      const p = toPanel(e);
      if (nearPoint3d(p)) moving3d = true; else rotating = [e.clientX, e.clientY];
      dsvg.setPointerCapture(e.pointerId);
      return;
    }
    if (!pick) return;
    const p = toPanel(e), [a, b, c, d] = pickArea;
    if (p.x < a || p.x > c || p.y < b || p.y > d) return;
    dragging = true; dsvg.setPointerCapture(e.pointerId); dualPointer(e);
  });
  dsvg.addEventListener("pointermove", e => {
    if (dsvg.classList.contains("rotate") && !rotating && !moving3d) {
      dsvg.style.cursor = nearPoint3d(toPanel(e)) ? "move" : "";
    }
    if (moving3d) {
      const p = toPanel(e), r = grab3d && grab3d.toU(p.x, p.y);
      if (r) {
        r.w.forEach((v, n) => setU(n, v, r.exact));
        render();
      }
    } else if (rotating) {
      view3d.az += 0.01 * (e.clientX - rotating[0]);
      view3d.el = clamp(view3d.el + 0.01 * (e.clientY - rotating[1]), 0.05, 1.5);
      rotating = [e.clientX, e.clientY];
      if (lastDual) renderDual(...lastDual);
    } else if (dragging) dualPointer(e);
  });
  ["pointerup", "pointercancel"].forEach(t => dsvg.addEventListener(t, () => { dragging = false; rotating = null; moving3d = false; }));

  // URL parameters: u (both prices), u1, u2, relax=12|1|2|none, dual=0.
  const params = new URLSearchParams(location.search);
  sliders.forEach((s, i) => {
    const v = parseFloat(params.get("u" + (i + 1)) ?? params.get("u"));
    if (Number.isFinite(v)) { s.max = "1000"; s.value = String(Math.max(v, 0)); }   // clamped in render()
  });
  // Default: nothing relaxed. relax= chooses explicitly; otherwise a given price relaxes its constraint.
  const relax = params.get("relax");
  boxes.forEach((b, i) => {
    b.checked = relax !== null ? relax.includes(String(i + 1)) : params.has("u" + (i + 1)) || params.has("u");
  });
  showDual = params.get("dual") !== "0";
  if (["3d", "vertex", "value"].includes(params.get("map"))) mapMode = params.get("map");
  document.querySelectorAll('input[name="mapmode"]').forEach(r => {
    r.checked = r.value === mapMode;
    r.addEventListener("change", () => { if (r.checked) { mapMode = r.value; render(); } });
  });
  sliders.forEach(s => s.addEventListener("input", render));
  [optVectors, optBoxes, optFit].forEach(o => o.addEventListener("change", render));
  const optLayout = document.getElementById("optLayout"), page = document.getElementById("page");
  const applyLayout = () => ["auto", "horizontal"].forEach(c => page.classList.toggle(c, optLayout.value === c));
  optLayout.addEventListener("change", applyLayout);
  // Shift an opened note sideways so it stays inside the window
  const placeHelp = h => {
    const pop = h.querySelector(".pop");
    pop.style.transform = "";
    const r = pop.getBoundingClientRect(), m = 8;
    const dx = Math.max(m - r.left, Math.min(0, innerWidth - m - r.right));
    if (dx) pop.style.transform = `translateX(calc(-50% + ${dx}px))`;
  };
  document.querySelectorAll(".help").forEach(h => {
    h.addEventListener("mouseenter", () => placeHelp(h));
    h.querySelector("button").addEventListener("click", () => { h.classList.toggle("open"); placeHelp(h); });
  });
  document.addEventListener("click", e => document.querySelectorAll(".help.open").forEach(h => { if (!h.contains(e.target)) h.classList.remove("open"); }));
  // Labels: each label (data-lab) shows while the pointer is over an object with its key in data-hl, or
  // when pinned. Clicking an object (or its label while shown by hovering it) pins its labels, clicking
  // a pinned label unpins it. "Show all labels" /
  // "Hide all labels" set the default for every label and forget the pins. The coordinates of x(u)
  // (key "hover-xs") only show on hover or when pinned.
  let hoverKeys = [];
  const pinned = new Map();                                // key -> shown, overriding allShown
  const shownKey = k => pinned.has(k) ? pinned.get(k) : allShown && !k.startsWith("hover-");
  function applyHover() {
    labelEls.forEach(t => {
      const k = t.getAttribute("data-lab");
      t.classList.toggle("show", hoverKeys.includes(k) || shownKey(k));
    });
  }
  const setAll = on => { allShown = on; pinned.clear(); render(); };
  document.getElementById("showLabels").addEventListener("click", () => setAll(true));
  document.getElementById("hideLabels").addEventListener("click", () => setAll(false));
  if (params.get("labels") === "1") allShown = true;
  svg.addEventListener("pointerover", e => {
    if (tieDrag) return;                                   // keep x(u)'s label while it is dragged
    if (e.target.closest && e.target.closest("text[data-lab]")) return;   // over a shown label: as before
    const t = e.target.closest && e.target.closest("[data-hl]");
    hoverKeys = t ? t.getAttribute("data-hl").split(" ") : [];
    applyHover();
  });
  svg.addEventListener("pointerleave", () => { if (!tieDrag) { hoverKeys = []; applyHover(); } });
  // A click (not the end of a drag of x(u)) pins the labels of an object, or unpins a label.
  let downAt = null;
  svg.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  svg.addEventListener("click", e => {
    if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
    const lab = e.target.closest && e.target.closest("text[data-lab]");
    const k = lab && lab.getAttribute("data-lab");
    if (lab && !shownKey(k)) {
      // Shown only by hovering its object (the label may cover it): pin as if the object was clicked.
      hoverKeys.forEach(h => pinned.set(h, true));
    } else if (lab) {
      pinned.set(k, false);
      hoverKeys = hoverKeys.filter(h => h !== k);          // hide it now, though its object may be under it
    } else {
      const t = e.target.closest && e.target.closest("[data-hl]");
      if (!t) return;
      t.getAttribute("data-hl").split(" ").forEach(k => pinned.set(k, true));
    }
    applyHover();
  });
  const layout = params.get("side") === "1" ? "horizontal" : params.get("layout");
  if (["auto", "vertical", "horizontal"].includes(layout)) optLayout.value = layout;
  applyLayout();
  // Dragging x(u) in the figure (only when several points are optimal).
  const figPt = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [q.x, q.y];
  };
  const nearTiePt = e => tieShape && tiePt && (([x, y], [a, b]) => Math.hypot(x - a, y - b) < 14)(figPt(e), px(tiePt));
  svg.addEventListener("pointerdown", e => {
    if (!nearTiePt(e)) return;
    tieDrag = true; svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener("pointermove", e => {
    if (tieDrag && tieShape) { tiePt = onTieSet(ipx(figPt(e))); render(); }
    else svg.style.cursor = nearTiePt(e) ? "move" : "";
  });
  ["pointerup", "pointercancel"].forEach(t => svg.addEventListener(t, () => { tieDrag = false; }));
  // A tick sets an exact value (step "any"); the slider snaps to 0.01 again as soon as it is touched.
  sliders.forEach(s => ["pointerdown", "keydown"].forEach(t => s.addEventListener(t, () => { s.step = "0.01"; })));
  formula.addEventListener("change", e => {                         // the relax-checkboxes in the system
    const i = e.target.dataset && e.target.dataset.i;
    if (i === undefined) return;
    boxes[+i].checked = e.target.checked;
    if (e.target.checked) { sliders[+i].step = "0.01"; sliders[+i].value = "0"; }   // a newly relaxed constraint starts at u_i = 0
    render();
  });
  // Choice of LP. Switching keeps which constraints are relaxed but starts the prices at 0; the choice
  // is kept in the URL (?lp=) so that reloading or sharing the link shows the same LP.
  const lpSelect = document.getElementById("lpSelect");
  LPS.forEach((lp, n) => lpSelect.add(new Option(`${n + 1}. ${lp.name}`, String(n))));
  lpSelect.value = String(lpIndex);
  lpSelect.addEventListener("change", () => {
    useLP(+lpSelect.value);
    sliders.forEach(s => { s.step = "0.01"; s.value = "0"; });
    tieKey = null; tieShape = null; lastSlot.clear();
    const q = new URLSearchParams(location.search);
    q.set("lp", String(lpIndex + 1));
    ["u", "u1", "u2"].forEach(k => q.delete(k));                     // the prices were reset
    try { history.replaceState(null, "", "?" + q); } catch (e) { /* e.g. sandboxed frame */ }
    render();
  });
  // Theme: ?theme= wins, then the viewer's last choice (this browser only), else Auto, which follows the
  // system's light/dark setting (and its changes).
  const optTheme = document.getElementById("optTheme");
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  const applyTheme = () => {
    const t = optTheme.value === "auto" ? (darkMQ.matches ? "dark" : "light") : optTheme.value;
    document.documentElement.setAttribute("data-theme", t);
  };
  const isTheme = t => ["auto", "light", "dark"].includes(t);
  let theme = params.get("theme");
  if (!isTheme(theme)) {
    try { theme = localStorage.getItem("lagrangean-theme"); } catch (e) { theme = null; }
  }
  optTheme.value = isTheme(theme) ? theme : "auto";
  applyTheme();
  optTheme.addEventListener("change", () => {
    try { localStorage.setItem("lagrangean-theme", optTheme.value); } catch (e) { /* storage unavailable */ }
    applyTheme();
    render();                                                      // the dual map/3D colours are computed
  });
  darkMQ.addEventListener("change", () => { if (optTheme.value === "auto") { applyTheme(); render(); } });
  render();
})();
</script>
</body>
</html>
